[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "querymcpal"
version = "0.1.0"
description = "QueryMCPal – Azure Cosmos DB (MongoDB API) MCP Server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "pymongo>=4.6.0",
    "azure-identity>=1.15.0",
    "azure-mgmt-resource>=23.0.0",
    "cachetools>=5.3.0",
    "requests>=2.31.0",
]

[project.scripts]
querymcpal = "querymcpal.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/querymcpal"]
